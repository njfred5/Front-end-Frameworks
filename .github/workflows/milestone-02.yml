# Milestone 2 — React Router and Single-Page Application Architecture
#
# This workflow runs when a student pushes the `milestone-2` tag.
#
# To submit:
#   git add .
#   git commit -m "Milestone 2 submission"
#   git tag milestone-2
#   git push origin milestone-2
#
# To resubmit (tags are unique):
#   git tag -d milestone-2
#   git push origin --delete milestone-2
#   git tag milestone-2 && git push origin milestone-2
#
# The workflow runs all three milestone test suites (M1 + M2 tests),
# confirming routing is in place AND Milestone 1 requirements still hold.

name: Milestone 2 — Routing and SPA Architecture

on:
  push:
    tags:
      - "milestone-2"

jobs:
  milestone-2:
    name: Milestone 2 Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Copy environment file
        run: cp .env.example .env

      # ── Static checks ───────────────────────────────────────────────────────

      - name: TypeScript — type check
        run: npm run type-check

      - name: ESLint — lint check
        run: npm run lint

      # ── Test suite (M1 regression + M2 tests) ──────────────────────────────

      - name: Run Milestone 2 tests
        run: npm run test:run:verbose

      # ── Notify Google Sheet ─────────────────────────────────────────────────

      - name: Notify Google Sheet
        if: always()
        run: |
          curl -X POST "${{ secrets.SHEETS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"repo\": \"${{ github.repository }}\",
              \"student\": \"${{ github.actor }}\",
              \"tag\": \"${{ github.ref_name }}\",
              \"status\": \"${{ job.status }}\",
              \"milestone\": \"2\",
              \"run_url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
            }"
