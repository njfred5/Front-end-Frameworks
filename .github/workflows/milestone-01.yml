# Milestone 1 — Props, State, and the useState Hook
#
# This workflow runs when a student pushes the `milestone-1` tag.
#
# To submit:
#   git add .
#   git commit -m "Milestone 1 submission"
#   git tag milestone-1
#   git push origin milestone-1
#
# The workflow runs three checks in sequence:
#   1. TypeScript type check  (npm run type-check)
#   2. ESLint                 (npm run lint)
#   3. Vitest test suite      (npm run test:run)
#
# All three must pass for a green result.

name: Milestone 1 — Props, State, and useState

on:
  push:
    tags:
      - "milestone-1"

jobs:
  milestone-1:
    name: Milestone 1 Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Copy environment file
        run: cp .env.example .env

      # ── Static checks ───────────────────────────────────────────────────────

      - name: TypeScript — type check
        run: npm run type-check

      - name: ESLint — lint check
        run: npm run lint

      # ── Test suite ──────────────────────────────────────────────────────────

      - name: Run Milestone 1 tests
        run: npm run test:m1

      # ── Notify Google Sheet ─────────────────────────────────────────────────

      - name: Notify Google Sheet
        if: always()
        run: |
          curl -X POST "${{ secrets.SHEETS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"repo\": \"${{ github.repository }}\",
              \"student\": \"${{ github.actor }}\",
              \"tag\": \"${{ github.ref_name }}\",
              \"status\": \"${{ job.status }}\",
              \"milestone\": \"1\",
              \"run_url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
            }"
